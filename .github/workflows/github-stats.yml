name: GitHub Stats Cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linguagens mais usadas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: selds
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_colors: github
          config_order: base.header, languages
          filename: assets/top-langs.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: atualizar stats de linguagens"

      - name: Estatisticas gerais
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: selds
          base: activity, community, repositories, metadata
          plugin_lines: yes
          filename: assets/stats.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: atualizar stats gerais"
